name: eform_ldte
description: "Website pembuatan berbagai formulir Lab Dasar Teknik Elektro - Sekolah Teknik Elektro dan Informatika Institut Teknologi Bandung"
publish_to: 'none'
version: 0.5.3+46

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter 
  get: ^4.7.3
  get_storage: ^2.1.1
  http: ^1.6.0
  cached_network_image: ^3.4.1
  dropdown_flutter: ^1.0.3
  auto_hide_keyboard: ^1.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  google_fonts: ^8.0.2
  intl: ^0.20.2
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  supabase_flutter: ^2.15.4
  number_paginator: ^1.1.2
  flutter_side_menu: ^0.5.41
  url_launcher: ^6.3.2
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  universal_html: ^2.3.0
  go_router: ^17.3.0
  internet_connection_checker_plus: ^3.0.0
  isolate_manager: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.1
  build_runner: ^2.15.1
  isolate_manager_generator: ^0.4.2
  rename_app: ^1.6.6

flutter:
  uses-material-design: true
  assets:
    - assets/
    - fonts/calibri.ttf
    - fonts/calibri-bold.ttf
    - fonts/calibri-italic.ttf
    - fonts/calibri-bold-italic.ttf
    - fonts/tahoma.ttf
    